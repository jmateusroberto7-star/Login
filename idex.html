        <!DOCTYPE html>
        <html lang="pt-br">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Login e Senha</title>
            <link rel="stylesheet" href="styles.css">
        </head>
        <body>
            
       
        <!--Imagem de Fundo da Página-->
        <div class="imagem">
          <img src="Floresta minimalista.png" alt="floresta">
        </div>

       
          <!--Caixa de Login com todas as Informações dentro-->
        <div class="login-card">
         <h1>Login</h1>   
        
         
         <!--Campo do Menu - pedir Usuário Email e Senha-->
        <form class="menu">
        <input type="email" id="campoEmail" placeholder="Digite seu Email" required>
        <input type="password" id="campoSenha" placeholder="Digite sua Senha" required>
        
        <!--Caixa de Checagem-->
         <div class="caixa">
          <label>
          <input type="checkbox">
          <span class="lembrar">Lembrar-me</span>
          </label>
          </div>

         
         <!--Botão Entrar-->
         
        <button type="submit" id="btnEntrar">Entrar</button>
       
        </form>

        </body>
        </html>
        <script src="script.js"></script>
